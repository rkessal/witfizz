version: "3.3"

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5001:80"
    environment:
      - NODE_ENV=production
    env_file:
      - ./client/.env
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
      - "5080:5080"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
    env_file:
      - ./server/.env
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./server/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema/create.sql:/docker-entrypoint-initdb.d/01-create.sql
      # - ./server/src/db/schema/development.sql:/docker-entrypoint-initdb.d/02-development.sql
      - ./server/src/db/schema/production.sql:/docker-entrypoint-initdb.d/03-production.sql
      - ./server/src/db/schema/sessions.sql:/docker-entrypoint-initdb.d/04-sessions.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
